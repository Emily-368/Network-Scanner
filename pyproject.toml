[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "0.1.0"
description = "Wi-Fi RSSI/SSID survey tool for choosing an IoT gateway location"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
netscan = "netscan.cli:main"

[tool.setuptools]
packages = ["netscan"]
